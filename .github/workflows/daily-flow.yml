name: IDX daily flow

# Stage 1 (screen) + stages 2-4 (deep dives), unattended, notified over Telegram.
# Setup and design notes: .github/automation.md
#
# OpenCode has no built-in cron; an external scheduler (cron-job.org) triggers
# this workflow via the workflow_dispatch API. The run is an agent (opencode run),
# not a plain HTTP call, because the idx-* skills are reasoning, not endpoints.
#
# Persistence is entirely server-side since ticket 08: the journal is the
# measurement_journal Postgres table (written via the log_verdict MCP tool) and
# config/reports live on R2. The runner is ephemeral and writes nothing to git,
# so it needs read-only repo access (for the skills only).

on:
  # Triggered externally at 07:00 WIB Mon-Fri by cron-job.org (or any scheduler)
  # hitting the workflow_dispatch API. Deliberately NO `schedule:` block: GitHub's
  # cron is best-effort (a run here was observed ~6h late, landing after the open)
  # and a second trigger would fire the flow twice — a second `session` re-logs
  # verdicts and can raise a Verdict Conflict. One trigger only.
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional anchor date (YYYY-MM-DD) for a catch-up run"
        required: false

# Read-only: the runner never pushes.
permissions:
  contents: read

concurrency:
  group: idx-daily-flow
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 120          # deep-dives every survivor, not just 3
    env:
      TZ: Asia/Jakarta
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      # A plain Ollama Cloud API key (dashboard -> API keys), dedicated to CI.
      # No credential export/import: the provider is declared inline in the
      # generated opencode.json below and reads this env var. See automation.md.
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'ollama-cloud/deepseek-v4.1-flash:1017' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout (skills only; the run writes nothing here)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: |
          npm install -g @opencode/cli
          opencode --version

      - name: Check credentials
        run: |
          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "::error::OLLAMA_API_KEY secret is not set"
            exit 1
          fi

      - name: Configure OpenCode (MCP + Ollama Cloud provider)
        # opencode.json is not tracked (it holds a token locally). The runner is
        # ephemeral, so generate it here. The provider is declared explicitly so
        # no `opencode auth` credential store is needed in CI: the API key comes
        # from OLLAMA_API_KEY. Model metadata (1M context / 384k output) mirrors
        # models.dev for deepseek-v4.1-flash:1017; add a block here to use
        # another model.
        run: |
          model="${OPENCODE_MODEL#ollama-cloud/}"
          if [ "$model" = "$OPENCODE_MODEL" ]; then
            echo "::error::OPENCODE_MODEL must be ollama-cloud/<model> (got: $OPENCODE_MODEL)"
            exit 1
          fi
          jq -n --arg model "$model" '{
            "$schema": "https://opencode.ai/config.json",
            mcp: { servers: { "idx-pipeline": {
              type: "remote",
              url: "https://idx-mcp-pipeline-e9100439789e.herokuapp.com/mcp",
              oauth: false,
              headers: { Authorization: "Bearer {env:MCP_TOKEN}" }
            } } },
            providers: {
              "ollama-cloud": {
                name: "Ollama Cloud",
                env: ["OLLAMA_API_KEY"],
                package: "@opencode/ai/providers/openai-compatible",
                settings: { baseURL: "https://ollama.com/v1" },
                models: { ($model): {
                  name: $model,
                  modelID: $model,
                  limit: { context: 1048576, output: 384000 },
                  capabilities: { tools: true, input: ["text", "image"], output: ["text"] }
                } }
              }
            }
          }' > opencode.json
          jq -e '.providers["ollama-cloud"].models | keys' opencode.json

      - name: Run daily flow
        run: |
          prompt="$(cat .github/prompts/daily-flow.md)"
          if [ -n "${{ inputs.as_of }}" ]; then
            prompt="$prompt"$'\n\n'"Catch-up run: screen as of ${{ inputs.as_of }} instead of the default anchor."
          fi
          opencode run --standalone --auto \
            --model "$OPENCODE_MODEL" \
            --title "IDX daily flow $(date +%F)" \
            "$prompt" \
            > digest.md 2> flow.err
          echo "opencode exit code: $?"

      - name: Job-log the digest
        if: always()
        run: |
          echo "----- digest.md -----"; cat digest.md 2>/dev/null || true
          echo "----- flow.err (tail) -----"; tail -n 50 flow.err 2>/dev/null || true

      - name: Notify Telegram
        if: always()
        run: bash .github/scripts/notify-telegram.sh
